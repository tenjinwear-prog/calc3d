<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora 3D</title>
<meta name="description" content="Custo e preço de venda dos produtos 3D, para venda física e marketplace.">
<meta name="theme-color" content="#1f2a24">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calc 3D">
<style>
:root{
  --bg:#edf1ee; --surface:#fbfcfa; --surface-2:#e2e8e4; --ink:#1f2a24; --ink-2:#56625b; --line:#d3dbd6;
  --fis:#2f7d5b; --fis-soft:#dcefe4; --mkt:#d4622a; --mkt-soft:#f8e1d3;
  --ok:#2f7d5b; --ok-soft:#dcefe4; --warn:#a86b00; --warn-soft:#fbecc8; --bad:#b83a2e; --bad-soft:#f8dcd8;
  --radius:16px; --shadow:0 1px 2px rgba(31,42,36,.06),0 4px 14px rgba(31,42,36,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a17; --surface:#1c2420; --surface-2:#26302b; --ink:#eef0ea; --ink-2:#a3aca5; --line:#33403a;
    --fis:#5cc495; --fis-soft:#1f3a2e; --mkt:#f08a55; --mkt-soft:#3d2619;
    --ok:#5cc495; --ok-soft:#1f3a2e; --warn:#e8b54a; --warn-soft:#3b3017; --bad:#f07a6e; --bad-soft:#3f1f1c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --surface-2:#26302b; --ink:#eef0ea; --ink-2:#a3aca5; --line:#33403a;
  --fis:#5cc495; --fis-soft:#1f3a2e; --mkt:#f08a55; --mkt-soft:#3d2619;
  --ok:#5cc495; --ok-soft:#1f3a2e; --warn:#e8b54a; --warn-soft:#3b3017; --bad:#f07a6e; --bad-soft:#3f1f1c;
  --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0;flex:1;font-weight:650;letter-spacing:-.01em}
.back{border:0;background:var(--surface-2);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer}
.sync{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-2)}
.dot.ok{background:var(--ok)} .dot.sync{background:var(--warn);animation:pulse 1s infinite} .dot.erro{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:0 0 12px;font-weight:650}
.home-hero{padding:8px 0 18px}
.home-hero p{margin:4px 0 0;color:var(--ink-2)}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.channel{border:0;border-radius:20px;padding:22px 16px;text-align:left;cursor:pointer;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;color:var(--ink);font:inherit}
.channel b{font-size:22px;letter-spacing:-.02em}
.channel span{font-size:13px;color:var(--ink-2)}
.channel.fis{background:var(--fis-soft);border:2px solid var(--fis)}
.channel.mkt{background:var(--mkt-soft);border:2px solid var(--mkt)}
.channel .ico{font-size:28px;line-height:1}
.links{display:grid;gap:10px}
.link{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--ink);font:inherit;width:100%;text-align:left}
.link small{color:var(--ink-2);display:block;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:1px}
.unit{position:relative}
.unit input{padding-right:46px}
.unit em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--ink-2);pointer-events:none}
.row{display:flex;gap:8px;align-items:center}
.row select{flex:1}
.btn{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:44px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--bad)}
.btn.big{flex:1;min-height:64px;font-size:17px;border-radius:14px}
.btn.okb{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.badb{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.prices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.price{border-radius:14px;padding:14px;background:var(--surface-2)}
.price small{display:block;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
.price b{display:block;font-size:28px;letter-spacing:-.02em;margin:4px 0 2px}
.price span{font-size:12px;color:var(--ink-2)}
.price.sug.fis{background:var(--fis-soft)} .price.sug.mkt{background:var(--mkt-soft)}
.price.sug.fis b{color:var(--fis)} .price.sug.mkt b{color:var(--mkt)}
.cost-line{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px dashed var(--line)}
.cost-line:last-child{border-bottom:0}
.cost-line.total{font-weight:700;border-top:1px solid var(--ink);border-bottom:0;margin-top:4px;padding-top:8px}
details summary{cursor:pointer;font-size:14px;color:var(--ink-2);padding:10px 0 2px}
.alert{border-radius:12px;padding:12px 14px;font-size:15px;margin-top:12px;border:1px solid}
.alert b{display:block;margin-bottom:2px}
.alert.ok{background:var(--ok-soft);border-color:var(--ok)} .alert.ok b{color:var(--ok)}
.alert.warn{background:var(--warn-soft);border-color:var(--warn)} .alert.warn b{color:var(--warn)}
.alert.bad{background:var(--bad-soft);border-color:var(--bad)} .alert.bad b{color:var(--bad)}
.alert.info{background:var(--surface-2);border-color:var(--line)}
.muted{color:var(--ink-2);font-size:14px}
.hint{font-size:12px;color:var(--ink-2);margin-top:4px}
.empty{text-align:center;padding:24px 8px;color:var(--ink-2)}
.range{position:relative;height:54px;margin:18px 4px 6px}
.range .track{position:absolute;left:0;right:0;top:22px;height:6px;border-radius:3px;background:var(--surface-2)}
.range .span{position:absolute;top:22px;height:6px;border-radius:3px;background:var(--ink-2);opacity:.45}
.range .mk{position:absolute;top:0;transform:translateX(-50%);text-align:center;font-size:11px;white-space:nowrap;color:var(--ink-2)}
.range .mk i{display:block;width:2px;height:16px;margin:2px auto 0;background:currentColor}
.range .mk.below{top:30px}
.range .mk.below i{margin:0 auto 2px}
.range .mk.min{color:var(--warn)} .range .mk.sug{color:var(--mkt)} .range .mk.eq{color:var(--bad)}
.comp{position:absolute;top:19px;width:10px;height:10px;border-radius:50%;background:var(--ink);transform:translateX(-50%);opacity:.7}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li:last-child{border-bottom:0}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.falha{background:var(--bad-soft);color:var(--bad)}
.log .grow{flex:1;min-width:0}
.log .x{border:0;background:none;color:var(--ink-2);font-size:18px;cursor:pointer;padding:4px 8px}
.stat{display:flex;align-items:baseline;gap:10px}
.stat b{font-size:34px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1}
.mats{display:grid;gap:8px}
.mat{display:grid;grid-template-columns:minmax(0,1fr) 104px auto;gap:8px;align-items:center}
.mat select{min-width:0}
.mat .x,.fitem .x{border:0;background:var(--surface-2);color:var(--ink-2);width:44px;height:44px;border-radius:10px;font-size:20px;cursor:pointer}
.flist{display:grid;gap:10px}
.fitem{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.fitem input,.fitem select{background:var(--surface)}
.fitem .span2{grid-column:1/-1}
.fmeta{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px}
.fmeta .btn{min-height:36px;padding:6px 12px}
.seg{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.seg button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:8px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-selected="true"]{background:var(--mkt-soft);border-color:var(--mkt);color:var(--mkt)}
.fin-link{border-color:var(--ink-2)}
.mesnav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.mesnav b{font-size:18px;letter-spacing:-.01em}
.mesnav .back:disabled{opacity:.35;cursor:default}
.fin-hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fin-hero .big{border-radius:14px;padding:16px 14px;background:var(--surface-2);min-width:0}
.fin-hero .big small{display:block;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.05em;font-weight:650}
.fin-hero .big b{display:block;font-size:34px;letter-spacing:-.02em;margin:6px 0 2px;white-space:nowrap}
@media (max-width:520px){.fin-hero{grid-template-columns:1fr}.fin-hero .big{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:12px}.fin-hero .big small{grid-column:1/-1}.fin-hero .big b{font-size:32px;margin:4px 0 0}.fin-hero .big span{text-align:right}}
.fin-hero .big span{font-size:12px;color:var(--ink-2)}
.fin-hero .lucro{background:var(--ok-soft)} .fin-hero .lucro b{color:var(--ok)}
.fin-hero .lucro.neg{background:var(--bad-soft)} .fin-hero .lucro.neg b{color:var(--bad)}
.fin-hero .saldo{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0;font-size:14px;color:var(--ink-2)}
.fin-hero .saldo b{font-size:17px;color:var(--ink)}
.neg{color:var(--bad)!important} .pos{color:var(--ok)}
.fbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);margin:2px 0 12px;gap:2px}
.fbar span{display:block;min-width:3px}
.c1{background:var(--ink-2)} .c2{background:var(--mkt)} .c3{background:var(--warn)} .c4{background:var(--ok)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:baseline}
.cost-line em{font-style:normal;font-size:12px;color:var(--ink-2);margin-left:4px}
.fin-acts{margin-bottom:14px}
.log li.tap{cursor:pointer}
.log li.tap:hover{background:var(--surface-2)}
.log .dia{font-size:13px;color:var(--ink-2);width:40px;flex:0 0 auto}
.log .val{font-weight:650;white-space:nowrap}
.tag.cont,.tag.ext{white-space:nowrap;text-transform:none;letter-spacing:0;font-size:12px;font-weight:600}
.tag.cont{background:var(--surface-2);color:var(--ink-2)} .tag.ext{background:var(--warn-soft);color:var(--warn)}
.fform{border:2px solid var(--ink);scroll-margin-top:72px}
.fbtns{margin-top:14px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:10px;color:var(--ink);font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;flex:0 0 auto}
.chip-fis{color:var(--fis);font-weight:700} .chip-mkt{color:var(--mkt);font-weight:700}
@media (max-width:380px){.prices{grid-template-columns:1fr}.price b{font-size:24px}}
</style>
</head>
<body>
<header>
  <button class="back" id="back" aria-label="Voltar" hidden>‹</button>
  <h1 id="title">Calculadora 3D</h1>
  <div class="sync" id="sync" hidden><span class="dot" id="syncDot"></span><span id="syncTxt"></span></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ================= Dados ================= */
const LS_KEY = 'calc3d:v1';
const MIN_REGISTROS = 20; // registros necessários para usar a taxa de falha real
const TIPOS = ['PLA', 'PETG', 'ABS', 'ASA', 'TPU', 'Nylon', 'PC', 'Outro'];
const FILAMENTO_PADRAO = { id: 'pla', tipo: 'PLA', nome: '', precoKg: 100 };
const PLATAFORMA_PADRAO = { id: 'shopee', nome: 'Shopee', taxaPct: 0, taxaFixa: 0 };
const DEFAULTS = {
  potenciaW: 200, tarifaKwh: 1, impressoraPreco: 3700, vidaUtilH: 5000,
  manutencaoH: 0, maoObraH: 15, falhaPadrao: 5, usarFalhaReal: true,
  imposto: 0, embalagem: 0, margemSug: 40, margemMin: 15,
  filamentos: [FILAMENTO_PADRAO], plataformas: [PLATAFORMA_PADRAO], updatedAt: 0
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const bool = v => v === true || String(v ?? '').trim().toLowerCase() === 'true';
// Listas chegam da planilha como texto JSON; aqui viram listas de novo.
function lista(v) {
  if (Array.isArray(v)) return v;
  if (typeof v === 'string' && v.trim().startsWith('[')) { try { const a = JSON.parse(v); if (Array.isArray(a)) return a; } catch (e) {} }
  return null;
}

function normalize(s) {
  s = s || {};
  return {
    settings: normSettings(s.settings),
    produtos: (s.produtos || []).map(normProduto),
    registros: (s.registros || []).map(normRegistro),
    vendas: (s.vendas || []).map(normVenda),
    despesas: (s.despesas || []).map(normDespesa),
    sync: { url: '', token: '', ...(s.sync || {}) },
    ui: { produtoId: null, plataformaId: null, mes: null, ...(s.ui || {}) }
  };
}
function normItem(i) { return { produtoId: String(i.produtoId ?? ''), nome: String(i.nome ?? ''), qtd: num(i.qtd), custoUnit: num(i.custoUnit) }; }
function normVenda(v) {
  return { id: String(v.id), data: String(v.data ?? '').slice(0, 10), descricao: String(v.descricao ?? ''), canal: String(v.canal ?? 'fisico'),
    canalNome: String(v.canalNome ?? ''), itens: (lista(v.itens) || []).map(normItem), valor: num(v.valor), taxas: num(v.taxas),
    updatedAt: num(v.updatedAt), deleted: bool(v.deleted) };
}
function normDespesa(d) {
  return { id: String(d.id), data: String(d.data ?? '').slice(0, 10), descricao: String(d.descricao ?? ''), categoria: String(d.categoria ?? 'Outros'),
    valor: num(d.valor), contado: bool(d.contado), updatedAt: num(d.updatedAt), deleted: bool(d.deleted) };
}
function normMaterial(m) { return { fid: String(m.fid ?? ''), g: num(m.g) }; }
function normProduto(p) {
  let materiais = (lista(p.materiais) || []).map(normMaterial);
  // Produtos da versão 1 só tinham o total de gramas: vira um material com o primeiro filamento.
  if (!materiais.length) materiais = [{ fid: '', g: num(p.gramas) }];
  return { id: String(p.id), nome: String(p.nome ?? ''), materiais, gramas: materiais.reduce((t, m) => t + m.g, 0), horas: num(p.horas),
    manualMin: num(p.manualMin), concorrentes: String(p.concorrentes ?? ''), updatedAt: num(p.updatedAt), deleted: bool(p.deleted) };
}
function normRegistro(r) {
  return { id: String(r.id), data: String(r.data ?? ''), tipo: r.tipo === 'falha' ? 'falha' : 'ok',
    produtoId: String(r.produtoId ?? ''), produto: String(r.produto ?? ''), motivo: String(r.motivo ?? ''),
    updatedAt: num(r.updatedAt), deleted: bool(r.deleted) };
}
function normSettings(s) {
  s = s || {};
  const o = {};
  for (const k in DEFAULTS) {
    const d = DEFAULTS[k];
    if (Array.isArray(d)) continue;
    o[k] = !(k in s) ? d : typeof d === 'number' ? num(s[k]) : typeof d === 'boolean' ? bool(s[k]) : String(s[k]);
  }
  // Versão 1 tinha um único filamento (filamentoKg) e uma única plataforma (mkt*).
  const fil = lista(s.filamentos) || [{ ...FILAMENTO_PADRAO, precoKg: 'filamentoKg' in s ? num(s.filamentoKg) : FILAMENTO_PADRAO.precoKg }];
  o.filamentos = fil.map(f => ({ id: String(f.id || uid()), tipo: String(f.tipo || 'PLA'), nome: String(f.nome ?? ''), precoKg: num(f.precoKg) }));
  if (!o.filamentos.length) o.filamentos = [{ ...FILAMENTO_PADRAO }];
  const pl = lista(s.plataformas) || [{ id: 'shopee', nome: s.mktNome ? String(s.mktNome) : 'Shopee', taxaPct: num(s.mktTaxaPct), taxaFixa: num(s.mktTaxaFixa) }];
  o.plataformas = pl.map(p => ({ id: String(p.id || uid()), nome: String(p.nome ?? ''), taxaPct: num(p.taxaPct), taxaFixa: num(p.taxaFixa) }));
  if (!o.plataformas.length) o.plataformas = [{ ...PLATAFORMA_PADRAO }];
  return o;
}
const filamento = fid => state.settings.filamentos.find(f => f.id === fid) || state.settings.filamentos[0];
const nomeFilamento = f => f.tipo + (f.nome ? ' ' + f.nome : '');
const plataforma = () => state.settings.plataformas.find(p => p.id === state.ui.plataformaId) || state.settings.plataformas[0];
const nomePlataforma = () => plataforma().nome || 'Marketplace';
// Para a planilha, as listas vão como texto JSON (uma célula cada).
function paraPlanilha() {
  const s = state.settings;
  return {
    settings: { ...s, filamentos: JSON.stringify(s.filamentos), plataformas: JSON.stringify(s.plataformas) },
    produtos: state.produtos.map(p => ({ ...p, materiais: JSON.stringify(p.materiais) })),
    registros: state.registros,
    vendas: state.vendas.map(v => ({ ...v, itens: JSON.stringify(v.itens) })),
    despesas: state.despesas
  };
}
const dadosSync = () => JSON.stringify([state.settings, state.produtos, state.registros, state.vendas, state.despesas]);
let state = (() => { try { return normalize(JSON.parse(localStorage.getItem(LS_KEY))); } catch (e) { return normalize(); } })();
function save(changed) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  if (changed) scheduleSync();
}
const produtosAtivos = () => state.produtos.filter(p => !p.deleted).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
const registrosAtivos = () => state.registros.filter(r => !r.deleted).sort((a, b) => b.updatedAt - a.updatedAt);
const produtoAtual = () => produtosAtivos().find(p => p.id === state.ui.produtoId) || produtosAtivos()[0] || null;

/* ================= Cálculo ================= */
function taxaFalha() {
  const regs = registrosAtivos(), n = regs.length, f = regs.filter(r => r.tipo === 'falha').length, s = state.settings;
  const real = s.usarFalhaReal && n >= MIN_REGISTROS;
  const taxa = real ? f / n : s.falhaPadrao / 100;
  return { taxa: Math.min(Math.max(taxa, 0), 0.9), real, n, f };
}
function custo(p) {
  const s = state.settings, h = p.horas;
  const porMaterial = p.materiais.map(m => { const f = filamento(m.fid); return { f, g: m.g, valor: m.g * f.precoKg / 1000 }; });
  const filamento_ = porMaterial.reduce((t, m) => t + m.valor, 0);
  const energia = s.potenciaW / 1000 * h * s.tarifaKwh;
  const desgaste = s.vidaUtilH > 0 ? s.impressoraPreco / s.vidaUtilH * h : 0;
  const manutencao = s.manutencaoH * h;
  const maoObra = p.manualMin / 60 * s.maoObraH;
  const producao = filamento_ + energia + desgaste + manutencao + maoObra;
  const tf = taxaFalha();
  const ajustado = producao / (1 - tf.taxa);
  return { filamento: filamento_, porMaterial, energia, desgaste, manutencao, maoObra, producao, falha: ajustado - producao, ajustado, tf };
}
function precos(p, canal) {
  const s = state.settings, c = custo(p), pl = plataforma();
  const fixa = canal === 'mkt' ? pl.taxaFixa : 0;
  const desc = s.imposto / 100 + (canal === 'mkt' ? pl.taxaPct / 100 : 0);
  const base = c.ajustado + s.embalagem + fixa;
  const preco = m => { const d = 1 - desc - m; return d > 0 ? base / d : NaN; };
  const lucro = P => P * (1 - desc) - base; // lucro por unidade a um preço P
  return { c, base, desc, fixa, equilibrio: preco(0), minimo: preco(s.margemMin / 100), sugerido: preco(s.margemSug / 100), lucro };
}

const brl = v => isFinite(v) ? BRL.format(v) : '—';
const pct = v => (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = id => document.getElementById(id);
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
function parsePrecos(txt) {
  return (txt.match(/\d[\d.]*(,\d+)?|\d+(\.\d+)?/g) || []).map(t => {
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
    return parseFloat(t);
  }).filter(v => isFinite(v) && v > 0);
}
const mediana = a => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };

function atualizarNegociacao(r) {
  const el = $('negRes'); if (!el) return;
  const q = num($('nQtd').value), t = num($('nTotal').value);
  if (!q || !t) { el.innerHTML = '<p class="hint">Digite a quantidade e o valor total para ver se o acordo vale a pena.</p>'; return; }
  const u = t / q, lucroTot = r.lucro(u) * q;
  let cls, tit, txt;
  if (u < r.equilibrio) { cls = 'bad'; tit = 'Prejuízo'; txt = `Você perde ${brl(-lucroTot)} no pedido. O custo é ${brl(r.equilibrio)} por unidade.`; }
  else if (u < r.minimo) { cls = 'warn'; tit = 'Abaixo do mínimo'; txt = `Ainda cobre o custo, mas sobra só ${brl(lucroTot)}. O mínimo seria ${brl(r.minimo * q)} (${brl(r.minimo)} cada).`; }
  else if (u < r.sugerido) { cls = 'ok'; tit = 'Bom acordo'; txt = `Lucro de ${brl(lucroTot)} no pedido. Dentro da faixa entre o mínimo e o sugerido.`; }
  else { cls = 'ok'; tit = 'Ótimo acordo'; txt = `Lucro de ${brl(lucroTot)} no pedido, no sugerido ou acima.`; }
  el.innerHTML = `<p class="muted" style="margin:10px 0 0">${brl(u)} por unidade</p><div class="alert ${cls}"><b>${tit}</b>${txt}</div>
    <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary" data-fin="regneg">Registrar venda</button></div>`;
}
function atualizarConcorrentes(r) {
  const el = $('concRes'); if (!el) return;
  const v = parsePrecos($('conc').value);
  if (!v.length) { el.innerHTML = '<p class="hint">Separe os preços por espaço, vírgula ou linha. O app compara com seus preços.</p>'; return; }
  const med = mediana(v), lo = Math.min(...v), hi = Math.max(...v);
  let cls, tit, txt;
  if (med < r.equilibrio) { cls = 'bad'; tit = 'Mercado abaixo do seu custo'; txt = `A mediana (${brl(med)}) não cobre seu custo de ${brl(r.equilibrio)}. Reveja o produto, o material ou o canal.`; }
  else if (med < r.minimo) { cls = 'warn'; tit = 'Concorrência abaixo do seu mínimo'; txt = `A mediana é ${brl(med)}. Vender nesse preço dá lucro de ${brl(r.lucro(med))}, abaixo da margem mínima.`; }
  else if (med < r.sugerido) { cls = 'info'; tit = 'Seu sugerido está acima do mercado'; txt = `Um preço entre ${brl(r.minimo)} e ${brl(med)} fica competitivo e ainda passa do mínimo.`; }
  else { cls = 'ok'; tit = 'Espaço para cobrar mais'; txt = `A mediana (${brl(med)}) está acima do seu sugerido. Dá para subir até perto de ${brl(med)}.`; }
  const vals = [...v, r.equilibrio, r.minimo, r.sugerido].filter(isFinite);
  const a = Math.min(...vals) * 0.9, b = Math.max(...vals) * 1.05, pos = x => ((x - a) / (b - a) * 100).toFixed(2) + '%';
  el.innerHTML = `
    <p class="muted" style="margin:10px 0 0">${v.length} preço${v.length > 1 ? 's' : ''} · menor ${brl(lo)} · mediana ${brl(med)} · maior ${brl(hi)}</p>
    <div class="range" aria-hidden="true">
      <div class="track"></div>
      <div class="span" style="left:${pos(lo)};width:calc(${pos(hi)} - ${pos(lo)})"></div>
      ${v.map(x => `<div class="comp" style="left:${pos(x)}"></div>`).join('')}
      ${isFinite(r.equilibrio) ? `<div class="mk eq below" style="left:${pos(r.equilibrio)}"><i></i>custo</div>` : ''}
      ${isFinite(r.minimo) ? `<div class="mk min" style="left:${pos(r.minimo)}">mín.<i></i></div>` : ''}
      ${isFinite(r.sugerido) ? `<div class="mk sug" style="left:${pos(r.sugerido)}">sug.<i></i></div>` : ''}
    </div>
    <div class="alert ${cls}"><b>${tit}</b>${txt}</div>`;
}

/* ================= Finanças ================= */
const CATEGORIAS = [
  { nome: 'Filamento', contado: true }, { nome: 'Energia', contado: true }, { nome: 'Peças e manutenção', contado: true },
  { nome: 'Embalagem', contado: null }, { nome: 'Frete', contado: false }, { nome: 'Anúncio', contado: false },
  { nome: 'Impostos e MEI', contado: false }, { nome: 'Ferramentas', contado: false }, { nome: 'Outros', contado: false }
];
// Embalagem só é "já contada" quando ela tem valor nas Configurações.
const categoriaContada = c => { const x = CATEGORIAS.find(k => k.nome === c); return x ? (x.contado === null ? state.settings.embalagem > 0 : x.contado) : false; };
const pad2 = n => String(n).padStart(2, '0');
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const mesHoje = () => hoje().slice(0, 7);
const mesAtual = () => /^\d{4}-\d{2}$/.test(state.ui.mes || '') ? state.ui.mes : mesHoje();
function nomeMes(m) {
  const [y, mm] = m.split('-').map(Number);
  const t = new Date(y, mm - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  return t.charAt(0).toUpperCase() + t.slice(1);
}
function somaMes(m, delta) { let [y, mm] = m.split('-').map(Number); mm += delta; while (mm < 1) { mm += 12; y--; } while (mm > 12) { mm -= 12; y++; } return `${y}-${pad2(mm)}`; }
const diaMes = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) : '';
const vendasAtivas = () => state.vendas.filter(v => !v.deleted);
const despesasAtivas = () => state.despesas.filter(d => !d.deleted);
const custoVenda = v => v.itens.reduce((t, i) => t + i.qtd * i.custoUnit, 0);
const qtdVenda = v => v.itens.reduce((t, i) => t + i.qtd, 0);
const lucroVenda = v => v.valor - custoVenda(v) - v.taxas;
// Custo de 1 unidade pelo app: produção com falhas + embalagem. Fica guardado na venda.
const custoUnitario = p => custo(p).ajustado + state.settings.embalagem;
function nomeCanal(c) { if (c === 'fisico') return 'Físico'; const p = state.settings.plataformas.find(x => x.id === c); return p ? p.nome || 'Marketplace' : ''; }
function taxasSugeridas(canal, valor, qtd) {
  const s = state.settings, p = canal === 'fisico' ? null : state.settings.plataformas.find(x => x.id === canal);
  return valor * s.imposto / 100 + (p ? valor * p.taxaPct / 100 + p.taxaFixa * qtd : 0);
}
function resumoMes(m) {
  const vs = vendasAtivas().filter(v => v.data.startsWith(m)), ds = despesasAtivas().filter(d => d.data.startsWith(m));
  const faturamento = vs.reduce((t, v) => t + v.valor, 0), producao = vs.reduce((t, v) => t + custoVenda(v), 0);
  const maoObra = vs.reduce((t, v) => t + v.itens.reduce((x, i) => { const p = state.produtos.find(k => k.id === i.produtoId); return x + (p ? i.qtd * p.manualMin / 60 * state.settings.maoObraH : 0); }, 0), 0);
  const taxas = vs.reduce((t, v) => t + v.taxas, 0);
  const extras = ds.filter(d => !d.contado).reduce((t, d) => t + d.valor, 0), estoque = ds.filter(d => d.contado).reduce((t, d) => t + d.valor, 0);
  return { vs, ds, nVendas: vs.length, nDespesas: ds.length, faturamento, producao, maoObra, taxas, extras, estoque,
    lucro: faturamento - producao - taxas - extras, saldo: faturamento - taxas - extras - estoque };
}

let finForm = null; // formulário aberto: { tipo: 'venda' | 'despesa', d: rascunho, editando: id | null }
function novaVenda(pre) {
  const p = produtoAtual();
  const itens = pre?.itens || [p ? { produtoId: p.id, nome: p.nome, qtd: 1, custoUnit: custoUnitario(p) } : { produtoId: '', nome: '', qtd: 1, custoUnit: 0 }];
  const d = { id: uid(), data: hoje(), descricao: '', canal: pre?.canal || 'fisico', itens, valor: pre?.valor || 0, taxas: 0, taxaManual: false };
  d.taxas = taxasSugeridas(d.canal, d.valor, itens.reduce((t, i) => t + i.qtd, 0));
  return d;
}
function telaFinancas() {

    <p class="hint">Faturamento − taxas − despesas extras − compras que o app já conta no custo (${brl(r.estoque)} em filamento, energia e peças). É o dinheiro que realmente sobrou.</p>

    ${r.vs.length ? `<ul class="log">${r.vs.sort((a, b) => b.data.localeCompare(a.data) || b.updatedAt - a.updatedAt).map(v => {

      return `<li class="tap" data-fin="editvenda" data-id="${v.id}"><span class="dia num">${diaMes(v.data)}</span><div class="grow">${esc(v.descricao || v.itens.map(i => i.nome).filter(Boolean).join(', ') || 'Venda')}
        <div class="hint">${esc(nomeCanal(v.canal) || v.canalNome)} · ${qtdVenda(v).toLocaleString('pt-BR')} un · lucro <b class="${l < 0 ? 'neg' : 'pos'}">${brl(l)}</b></div></div>
        <span class="num val">${brl(v.valor)}</span></li>`; }).join('')}</ul>`
      : `<p class="muted">Nenhuma venda em ${nomeMes(m).toLowerCase()}. Toque em <b>+ Venda</b> ou use <b>Registrar venda</b> na negociação da venda física.</p>`}

        <div class="hint">${esc(d.categoria)} · <span class="tag ${d.contado ? 'cont' : 'ext'}">${d.contado ? 'contado no app' : 'extra'}</span></div></div>

}
function formFin() {
  const f = finForm, d = f.d;
  if (f.tipo === 'despesa') return `<div class="card fform" id="fform"><h2>${f.editando ? 'Editar despesa' : 'Nova despesa'}</h2>

  </div>`;
  const prods = produtosAtivos(), qtd = d.itens.reduce((t, i) => t + i.qtd, 0), custoT = d.itens.reduce((t, i) => t + i.qtd * i.custoUnit, 0);

}
function previaVenda(d, qtd, custoT) {
  if (!d.valor) return '<p class="hint">Digite o valor recebido para ver o lucro desta venda.</p>';
  const l = d.valor - custoT - d.taxas;
  const cls = l < 0 ? 'bad' : 'ok';
  return `<div class="alert ${cls}"><b>Lucro desta venda: ${brl(l)}</b>${qtd ? `${brl(d.valor / qtd)} por unidade · ` : ''}custo ${brl(custoT)} · taxas ${brl(d.taxas)}</div>`;
}
function atualizarFormVenda() {
  const d = finForm.d, qtd = d.itens.reduce((t, i) => t + i.qtd, 0), custoT = d.itens.reduce((t, i) => t + i.qtd * i.custoUnit, 0);
  if (!d.taxaManual) { d.taxas = taxasSugeridas(d.canal, d.valor, qtd); const t = $('vTaxas'); if (t && document.activeElement !== t) t.value = d.taxas ? +d.taxas.toFixed(2) : ''; }
  $('vCusto').textContent = 'Custo de produção: ' + brl(custoT);
  $('vPrev').innerHTML = previaVenda(d, qtd, custoT);
}
function finClick(acao, el) {
  if (acao === 'mesant' || acao === 'mesprox') { state.ui.mes = somaMes(mesAtual(), acao === 'mesant' ? -1 : 1); finForm = null; save(false); render(); return; }
  if (acao === 'novavenda') { finForm = { tipo: 'venda', d: novaVenda(), editando: null }; render(); $('fform')?.scrollIntoView({ block: 'start' }); return; }
  if (acao === 'novadespesa') { finForm = { tipo: 'despesa', d: { id: uid(), data: hoje(), descricao: '', categoria: 'Filamento', valor: 0, contado: true }, editando: null }; render(); $('fform')?.scrollIntoView({ block: 'start' }); return; }
  if (acao === 'editvenda' || acao === 'editdespesa') {
    const lst = acao === 'editvenda' ? state.vendas : state.despesas, x = lst.find(k => k.id === el.dataset.id); if (!x) return;
    const d = JSON.parse(JSON.stringify(x));
    if (acao === 'editvenda') d.taxaManual = Math.abs(d.taxas - taxasSugeridas(d.canal, d.valor, qtdVenda(d))) > 0.005;
    finForm = { tipo: acao === 'editvenda' ? 'venda' : 'despesa', d, editando: x.id }; render(); $('fform')?.scrollIntoView({ block: 'start' }); return;
  }
  if (acao === 'regneg') {
    const p = produtoAtual(); if (!p) return;
    const q = num($('nQtd').value), t = num($('nTotal').value);
    finForm = { tipo: 'venda', d: novaVenda({ canal: 'fisico', valor: t, itens: [{ produtoId: p.id, nome: p.nome, qtd: q, custoUnit: custoUnitario(p) }] }), editando: null };
    state.ui.mes = mesHoje(); save(false);
    location.hash = 'financas'; return;
  }
  if (acao === 'cancelar') { finForm = null; render(); return; }
  if (acao === 'additem') { const p = produtosAtivos()[0]; finForm.d.itens.push({ produtoId: p?.id || '', nome: p?.nome || '', qtd: 1, custoUnit: p ? custoUnitario(p) : 0 }); render(); $('fform')?.scrollIntoView({ block: 'start' }); return; }
  if (acao === 'rmitem') { finForm.d.itens.splice(num(el.dataset.i), 1); render(); $('fform')?.scrollIntoView({ block: 'start' }); return; }
  if (acao === 'salvar') {
    const f = finForm, d = f.d;
    if (!d.valor) { toast('Digite o valor'); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.data)) d.data = hoje();
    if (f.tipo === 'venda') {
      d.itens = d.itens.filter(i => i.qtd > 0);
      const v = normVenda({ ...d, canalNome: nomeCanal(d.canal), updatedAt: Date.now() });
      const i = state.vendas.findIndex(k => k.id === v.id); if (i >= 0) state.vendas[i] = v; else state.vendas.push(v);
    } else {
      const x = normDespesa({ ...d, updatedAt: Date.now() });
      const i = state.despesas.findIndex(k => k.id === x.id); if (i >= 0) state.despesas[i] = x; else state.despesas.push(x);
    }
    state.ui.mes = d.data.slice(0, 7); finForm = null; save(true); render(); toast(f.tipo === 'venda' ? 'Venda salva' : 'Despesa salva'); return;
  }
  if (acao === 'excluir') {
    const f = finForm, lst = f.tipo === 'venda' ? state.vendas : state.despesas, x = lst.find(k => k.id === f.editando);
    if (x && confirm(f.tipo === 'venda' ? 'Excluir esta venda?' : 'Excluir esta despesa?')) { x.deleted = true; x.updatedAt = Date.now(); finForm = null; save(true); render(); }
  }
}
function finInput(t) {
  const d = finForm?.d; if (!d) return false;
  if (t.dataset.df) {
    const k = t.dataset.df;
    if (k === 'contado') d.contado = t.checked;
    else if (k === 'valor') d.valor = num(t.value);
    else d[k] = t.value;
    if (k === 'categoria') { d.contado = categoriaContada(t.value); $('dCont').checked = d.contado; }
    return true;
  }
  if (t.dataset.vf) {
    const k = t.dataset.vf;
    if (k === 'valor') d.valor = num(t.value);
    else if (k === 'taxas') { d.taxas = num(t.value); d.taxaManual = t.value !== ''; $('vTaxaHint').textContent = d.taxaManual ? 'Valor digitado por você' : 'Calculado pelas Configurações'; }
    else d[k] = t.value;
    atualizarFormVenda(); return true;
  }
  if (t.dataset.vi !== undefined) {
    const it = d.itens[num(t.dataset.vi)];
    if (t.dataset.k === 'qtd') it.qtd = num(t.value);
    else { const p = state.produtos.find(x => x.id === t.value); it.produtoId = t.value; it.nome = p?.nome || ''; it.custoUnit = p ? custoUnitario(p) : 0; }
    atualizarFormVenda(); return true;
  }
  return false;
}

/* ================= Eventos ================= */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if (go) { finForm = null; location.hash = go.dataset.go; return; }
  const fin = e.target.closest('[data-fin]'); if (fin) { finClick(fin.dataset.fin, fin); return; }
  const plat = e.target.closest('[data-plat]');
  if (plat) { state.ui.plataformaId = plat.dataset.plat; save(false); render(); return; }
  const del = e.target.closest('[data-del]');
  if (del) { const r = state.registros.find(x => x.id === del.dataset.del); if (r && confirm('Apagar este registro?')) { r.deleted = true; r.updatedAt = Date.now(); save(true); render(); } return; }
  const btn = e.target.closest('[data-act]'), act = btn?.dataset.act; if (!act) return;
  const idx = num(btn.dataset.i), s = state.settings;
  const mudouConfig = () => { s.updatedAt = Date.now(); save(true); render(); };
  if (act === 'addmat' || act === 'rmmat') {
    const p = produtoAtual(); if (!p) return;
    if (act === 'addmat') p.materiais.push({ fid: s.filamentos[0].id, g: 0 });
    else p.materiais.splice(idx, 1);
    p.gramas = p.materiais.reduce((t, m) => t + m.g, 0); p.updatedAt = Date.now(); save(true); render();
    if (act === 'addmat') $('mg' + (p.materiais.length - 1))?.focus();
  }
  if (act === 'addfil') { s.filamentos.push({ id: uid(), tipo: 'PLA', nome: '', precoKg: 100 }); mudouConfig(); $('fn' + (s.filamentos.length - 1))?.focus(); }
  if (act === 'rmfil' && s.filamentos.length > 1) {
    const f = s.filamentos[idx], resto = s.filamentos.filter((_, i) => i !== idx);
    const afetados = produtosAtivos().filter(p => p.materiais.some(m => filamento(m.fid).id === f.id));
    const msg = afetados.length
      ? `Remover ${nomeFilamento(f)}? ${afetados.length} produto${afetados.length > 1 ? 's passam' : ' passa'} a usar ${nomeFilamento(resto[0])} no lugar.`
      : `Remover ${nomeFilamento(f)}?`;
    if (confirm(msg)) {
      afetados.forEach(p => { p.materiais.forEach(m => { if (filamento(m.fid).id === f.id) m.fid = resto[0].id; }); p.updatedAt = Date.now(); });
      s.filamentos = resto; mudouConfig();
    }
  }
  if (act === 'addplat') { s.plataformas.push({ id: uid(), nome: '', taxaPct: 0, taxaFixa: 0 }); mudouConfig(); $('pln' + (s.plataformas.length - 1))?.focus(); }
  if (act === 'rmplat' && s.plataformas.length > 1 && confirm(`Remover ${s.plataformas[idx].nome || 'esta plataforma'}?`)) { s.plataformas.splice(idx, 1); mudouConfig(); }
  if (act === 'novo') { const p = normProduto({ id: uid(), nome: '', updatedAt: Date.now() }); state.produtos.push(p); state.ui.produtoId = p.id; save(true); render(); $('pNome')?.focus(); }
  if (act === 'excluir') { const p = produtoAtual(); if (p && confirm(`Excluir "${p.nome || 'Sem nome'}"? Ele some dos dois canais.`)) { p.deleted = true; p.updatedAt = Date.now(); state.ui.produtoId = null; save(true); render(); } }
  if (act === 'regok' || act === 'regfalha') {
    const pid = $('rProd').value, p = state.produtos.find(x => x.id === pid);
    state.registros.push(normRegistro({ id: uid(), tipo: act === 'regok' ? 'ok' : 'falha', produtoId: pid, produto: p ? p.nome : '',
      motivo: act === 'regfalha' ? $('rMotivo').value.trim() : '', data: new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }), updatedAt: Date.now() }));
    save(true); render(); toast(act === 'regok' ? 'Impressão registrada' : 'Falha registrada');
  }
  if (act === 'salvarsync') { state.sync.url = $('sUrl').value.trim(); state.sync.token = $('sTok').value.trim(); save(false); mostrarSync(); sync(true); }
  if (act === 'desligarsync') { state.sync = { url: '', token: '' }; save(false); mostrarSync(); render(); toast('Sincronização desligada'); }
  if (act === 'exportar') {
    const blob = new Blob([JSON.stringify({ settings: state.settings, produtos: state.produtos, registros: state.registros, vendas: state.vendas, despesas: state.despesas }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `calc3d-backup-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href);
  }
});
document.addEventListener('input', e => {
  const t = e.target, r = rota();
  if (r === 'financas' && finInput(t)) return;
  if (t.dataset.mf !== undefined || t.dataset.mg !== undefined) {
    const p = produtoAtual(); if (!p) return;
    const i = num(t.dataset.mf ?? t.dataset.mg);
    if (t.dataset.mf !== undefined) p.materiais[i].fid = t.value; else p.materiais[i].g = num(t.value);
    p.gramas = p.materiais.reduce((x, m) => x + m.g, 0); p.updatedAt = Date.now(); save(true);
    const tot = $('pTotalG'); if (tot) tot.textContent = totalGramasTxt(p);
    atualizarCanal(r);
  } else if (t.dataset.ff || t.dataset.pl) {
    const s = state.settings, i = num(t.dataset.i);
    if (t.dataset.ff) { const k = t.dataset.ff; s.filamentos[i][k] = k === 'precoKg' ? num(t.value) : t.value; }
    else { const k = t.dataset.pl; s.plataformas[i][k] = k === 'nome' ? t.value : num(t.value); }
    s.updatedAt = Date.now(); save(true);
  } else if (t.dataset.pf) {
    const p = produtoAtual(); if (!p) return;
    const k = t.dataset.pf;
    if (k === 'nome') p.nome = t.value;
    else if (k === 'h' || k === 'm') p.horas = num($('pH').value) + num($('pM').value) / 60;
    else p[k] = num(t.value);
    p.updatedAt = Date.now(); save(true);
    if (k === 'nome') { const o = $('selProduto')?.selectedOptions[0]; if (o) o.textContent = p.nome || 'Sem nome'; }
    atualizarCanal(r);
  } else if (t.id === 'nQtd' || t.id === 'nTotal') { atualizarNegociacao(precos(produtoAtual(), 'fisico')); }
  else if (t.id === 'conc') { const p = produtoAtual(); p.concorrentes = t.value; p.updatedAt = Date.now(); save(true); atualizarConcorrentes(precos(p, 'mkt')); }
  else if (t.dataset.cf) {
    const k = t.dataset.cf, s = state.settings;
    s[k] = t.type === 'checkbox' ? t.checked : typeof DEFAULTS[k] === 'number' ? num(t.value) : t.value;
    s.updatedAt = Date.now(); save(true);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'selProduto') { state.ui.produtoId = e.target.value; save(false); render(); }
  if (e.target.dataset.cf === 'usarFalhaReal') { state.settings.usarFalhaReal = e.target.checked; state.settings.updatedAt = Date.now(); save(true); }
  if (e.target.id === 'importar' && e.target.files[0]) {
    e.target.files[0].text().then(txt => {
      const d = JSON.parse(txt);
      if (!confirm('Substituir os dados deste aparelho pelo backup?')) return;
      state.settings = { ...normSettings(d.settings), updatedAt: Date.now() };
      state.produtos = (d.produtos || []).map(p => ({ ...normProduto(p), updatedAt: Date.now() }));
      state.registros = (d.registros || []).map(r => ({ ...normRegistro(r), updatedAt: Date.now() }));
      state.vendas = (d.vendas || []).map(v => ({ ...normVenda(v), updatedAt: Date.now() }));
      state.despesas = (d.despesas || []).map(x => ({ ...normDespesa(x), updatedAt: Date.now() }));
      save(true); render(); toast('Backup restaurado');
    }).catch(() => toast('Arquivo de backup inválido'));
  }
});
$('back').onclick = () => { if (history.length > 1 && rota() !== 'home') history.back(); else location.hash = 'home'; };
window.addEventListener('hashchange', () => {
  if (rota() !== 'financas') finForm = null;
  render();
  if (finForm) $('fform')?.scrollIntoView({ block: 'start' });
});

/* ================= Sincronização com Google Sheets ================= */
let syncTimer = null, syncing = false, syncAgain = false;
function mostrarSync(estado, txt) {
  const on = !!state.sync.url; $('sync').hidden = !on; if (!on) return;
  $('syncDot').className = 'dot ' + (estado || '');
  $('syncTxt').textContent = txt || (estado === 'ok' ? 'Sincronizado' : estado === 'sync' ? 'Sincronizando' : estado === 'erro' ? 'Sem conexão' : 'Sheets');
}
function scheduleSync() { if (!state.sync.url) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(false), 1500); }
function mergeLista(local, remoto, norm) {
  const m = new Map(local.map(x => [x.id, x]));
  (remoto || []).map(norm).forEach(x => { if (!x.id || x.id === 'undefined') return; const cur = m.get(x.id); if (!cur || x.updatedAt > cur.updatedAt) m.set(x.id, x); });
  return [...m.values()];
}
async function sync(manual) {
  const { url, token } = state.sync; if (!url) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; mostrarSync('sync');
  try {
    const res = await fetch(url + (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(token), { cache: 'no-store' });
    const remoto = await res.json();
    if (remoto.error) throw new Error(remoto.error);
    const antes = dadosSync();
    if (remoto.settings && num(remoto.settings.updatedAt) > state.settings.updatedAt) state.settings = normSettings(remoto.settings);
    state.produtos = mergeLista(state.produtos, remoto.produtos, normProduto);
    state.registros = mergeLista(state.registros, remoto.registros, normRegistro);
    state.vendas = mergeLista(state.vendas, remoto.vendas, normVenda);
    state.despesas = mergeLista(state.despesas, remoto.despesas, normDespesa);
    save(false);
    const post = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ token, data: paraPlanilha() }) });
    const ok = await post.json();
    if (!ok.ok) throw new Error(ok.error || 'falha ao salvar');
    mostrarSync('ok');
    if (manual) toast('Sincronizado com a planilha');
    const mudou = antes !== dadosSync();
    const digitando = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (mudou && !finForm && (!digitando || manual)) render();
  } catch (err) {
    mostrarSync('erro');
    if (manual) toast('Não consegui sincronizar: ' + (err.message === 'chave inválida' ? 'chave inválida' : 'confira o endereço'));
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; scheduleSync(); }
  }
}
window.addEventListener('focus', () => scheduleSync());
window.addEventListener('online', () => scheduleSync());
document.addEventListener('visibilitychange', () => { if (!document.hidden) scheduleSync(); });

/* ================= Início ================= */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
mostrarSync();
render();
if (state.sync.url) sync(false);
</script>
